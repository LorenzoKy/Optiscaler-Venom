# RULE: the newest release (stable, pre-release or nightly) must always be listed above the older ones.
# GitHub orders releases by the date of the commit the tag points to, so every release tag must sit on a
# commit made at publish time (nightly: the "Changelog" commit below; manual releases: tag a fresh commit).
# Every day: takes the latest official OptiScaler nightly, applies the Opti-Venom
# patches (branch opti-venom of LorenzoKy/OptiScaler) on the same upstream commit,
# builds it and publishes a pre-release. On a conflict it skips the build and opens an issue.
# GitHub starts scheduled runs late, often by hours (upstream's 04:00 UTC nightly comes out around 09:00 UTC),
# so a quick check runs every hour and the build starts at the first check that finds today's upstream nightly
# not built yet. If it is still missing at 20:00 Italian time the check fails, so GitHub sends a mail.
# Two-way sync: a nightly is published only if the patch branch has the latest release (.github/venom-patch),
# and none is needed on a day a release came out with the current patches on that nightly.
name: Nightly

on:
  schedule:
    # Off the full hour, where GitHub's queue is longest
    - cron: "23 5-21 * * *"
  workflow_dispatch:
    inputs:
      nightly_tag:
        description: "Upstream nightly tag (empty = latest)"
        required: false
      force:
        description: "Rebuild even if this nightly was already released"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  UPSTREAM: optiscaler/OptiScaler
  NIGHTLY_REPO: optiscaler/OptiScaler-nightly
  PATCH_REPO: LorenzoKy/OptiScaler
  PATCH_BRANCH: opti-venom
  KEEP_NIGHTLIES: 14
  GH_TOKEN: ${{ github.token }}

jobs:
  # Cheap Linux check every hour, the Windows build only when there's something to build
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.find.outputs.build }}
      tag: ${{ steps.find.outputs.tag }}
      sha: ${{ steps.find.outputs.sha }}
      date: ${{ steps.find.outputs.date }}
      ours: ${{ steps.find.outputs.ours }}
      url: ${{ steps.find.outputs.url }}

    steps:
    - name: Find upstream nightly
      id: find
      run: |
        tag="${{ inputs.nightly_tag }}"
        [ -z "$tag" ] && tag=$(gh release list -R "$NIGHTLY_REPO" -L 1 --json tagName --jq '.[0].tagName')
        [ -z "$tag" ] && { echo "::error::No upstream nightly found"; exit 1; }
        hour=$(TZ=Europe/Rome date +%-H)
        if [ "${{ github.event_name }}" = "schedule" ] && [ "${tag#nightly-}" != "$(date -u +%Y%m%d)" ]; then
          if [ "$hour" -ge 20 ]; then
            echo "::error::$hour:00 Italian time and today's upstream nightly is still missing (latest: $tag)"; exit 1
          fi
          echo "Today's upstream nightly is not out yet (latest: $tag), the next hourly check looks again"
          echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        date=${tag#nightly-}
        ours="opti-venom-nightly-$date"
        if [ "${{ inputs.force }}" != "true" ] && gh release view "$ours" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "$ours already released, nothing to do"
          echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        published=$(gh release view "$tag" -R "$NIGHTLY_REPO" --json publishedAt --jq .publishedAt)
        # The upstream nightly builds master as it is when its run starts. Its notes skip merge commits, so their
        # first commit isn't always the one built: take master's last commit before that run started.
        started=$(gh api "repos/$NIGHTLY_REPO/actions/runs?status=success&per_page=30" \
          --jq "[.workflow_runs[] | select(.run_started_at <= \"$published\")][0].run_started_at")
        sha=$(gh api "repos/$UPSTREAM/commits?sha=master&until=${started:-$published}&per_page=1" --jq '.[0].sha')
        [ -z "$sha" ] && { echo "::error::No upstream commit found before $published"; exit 1; }
        # Not needed when a Venom release came out today with the current patches on this nightly or a newer master
        patch_head=$(gh api "repos/$PATCH_REPO/commits/$PATCH_BRANCH" --jq .sha)
        release_patch=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/venom-patch" --jq .content 2>/dev/null \
          | base64 -d 2>/dev/null | tr -d '[:space:]' || true)
        last=$(gh release list -R "$GITHUB_REPOSITORY" -L 30 --json tagName,publishedAt,isDraft \
          --jq '[.[] | select(.isDraft | not) | select(.tagName | startswith("opti-venom-nightly-") | not)][0] | .tagName + " " + .publishedAt')
        last_day=${last#* }
        if [ "${{ inputs.force }}" != "true" ] && [ "${last_day:0:10}" = "$(date -u +%F)" ] && [ "$release_patch" = "$patch_head" ]; then
          status=$(gh api "repos/$PATCH_REPO/compare/$sha...$patch_head" --jq .status 2>/dev/null || true)
          if [ "$status" = "ahead" ] || [ "$status" = "identical" ]; then
            echo "${last% *}, released today, already has $tag and the current Venom changes: no nightly needed"
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
        fi
        {
          echo "build=true"; echo "tag=$tag"; echo "sha=$sha"; echo "date=$date"; echo "ours=$ours"
          echo "url=https://github.com/$NIGHTLY_REPO/releases/tag/$tag"
        } >> "$GITHUB_OUTPUT"
        echo "Upstream nightly $tag (run started ${started:-unknown}) = $UPSTREAM@$sha"

  nightly:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.check.outputs.tag }}
      SHA: ${{ needs.check.outputs.sha }}
      DATE: ${{ needs.check.outputs.date }}
      OURS: ${{ needs.check.outputs.ours }}
      NIGHTLY_URL: ${{ needs.check.outputs.url }}

    steps:
    - uses: actions/checkout@v6
      with:
        path: venom

    - name: Merge Opti-Venom patches
      id: merge
      run: |
        git config --global user.name "LorenzoKy"
        git config --global user.email "136495843+LorenzoKy@users.noreply.github.com"
        git config --global core.autocrlf false
        export TZ=UTC
        git clone -q "https://github.com/$UPSTREAM.git" src
        cd src
        git checkout -q --detach "$SHA"
        git fetch -q "https://github.com/$PATCH_REPO.git" "$PATCH_BRANCH:venom-patch"
        # The nightly must have everything of the latest Venom release
        released=$(tr -d '[:space:]' < ../venom/.github/venom-patch 2>/dev/null || true)
        if [ -n "$released" ]; then
          git fetch -q "https://github.com/$PATCH_REPO.git" "$released" 2>/dev/null || true
          if ! git merge-base --is-ancestor "$released" venom-patch 2>/dev/null; then
            echo "::error::$PATCH_BRANCH doesn't have the latest release's commit $released: push the release's patches there first"
            exit 1
          fi
        fi
        # Only our commits: those of the patch branch that upstream master doesn't have
        base=$(git merge-base venom-patch origin/master)
        git log --reverse --format="- [\`%h\`](https://github.com/$PATCH_REPO/commit/%H) %s" "$base..venom-patch" > ../patches.txt
        # Patches already on a newer master than the nightly's: built as they are, they have the nightly
        upstream=$SHA
        newer=false
        if [ "$base" != "$SHA" ] && git merge-base --is-ancestor "$SHA" "$base"; then
          upstream=$base
          newer=true
          git checkout -q --detach "$base"
        fi
        {
          echo "upstream_sha=$upstream"
          echo "newer=$newer"
          echo "base=$base"
          echo "patch=$(git rev-parse --short=8 venom-patch)"
          echo "patch_sha=$(git rev-parse venom-patch)"
          echo "patch_date=$(git log -1 --format=%cd --date=format-local:%Y-%m-%d venom-patch)"
          echo "upstream_date=$(git log -1 --format=%cd --date=format-local:%Y-%m-%d HEAD)"
        } >> "$GITHUB_OUTPUT"
        if ! git cherry-pick "$base..venom-patch" > ../pick.log 2>&1; then
          git diff --name-only --diff-filter=U > ../conflicts.txt
          git cherry-pick --abort || true
          echo "conflict=true" >> "$GITHUB_OUTPUT"
          cat ../pick.log
          exit 0
        fi
        echo "conflict=false" >> "$GITHUB_OUTPUT"
        git submodule update --init --recursive -q

    - name: Report conflict
      if: steps.merge.outputs.conflict == 'true'
      run: |
        title="Nightly $DATE: Opti-Venom patches conflict with upstream"
        {
          echo "The automatic nightly build was skipped."
          echo
          echo "- Upstream nightly: [$TAG]($NIGHTLY_URL), commit [\`$SHA\`](https://github.com/$UPSTREAM/commit/$SHA)"
          echo "- Patches: \`$PATCH_REPO@$PATCH_BRANCH\` (\`${{ steps.merge.outputs.patch }}\`)"
          echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo
          echo "Conflicting files:"
          sed 's/^/- `/; s/$/`/' conflicts.txt
          echo
          echo "Rebase \`$PATCH_BRANCH\` on the new upstream master and push it: the next run picks it up."
        } > issue.md
        open=$(gh issue list -R "$GITHUB_REPOSITORY" --label nightly-conflict --state open --json number --jq '.[0].number')
        if [ -n "$open" ]; then
          gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body-file issue.md
        else
          gh label create nightly-conflict -R "$GITHUB_REPOSITORY" --color B91C1C --description "Automatic nightly skipped" 2>/dev/null || true
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --label nightly-conflict --body-file issue.md
        fi
        echo "::error::Patches conflict with $TAG, build skipped"
        exit 1

    # The upstream commits since the one the previous nightly was built on, merged pull requests by their title
    - name: Upstream changes
      id: upstream
      if: steps.merge.outputs.conflict == 'false'
      working-directory: src
      env:
        SHA: ${{ steps.merge.outputs.upstream_sha }}
      run: |
        prev=$(sed -n '/<!-- nightly-rows -->/,$p' ../venom/CHANGELOG-Opti-Venom.md | grep '^|' | grep -vF "$OURS" | head -1 \
          | grep -oE "github.com/$UPSTREAM/commit/[0-9a-f]{40}" | head -1 | grep -oE '[0-9a-f]{40}$' || true)
        since=last
        if [ -n "$prev" ] && git merge-base --is-ancestor "$prev" "$SHA"; then
          commits=$(git rev-list --first-parent "$prev..$SHA")
        else
          since=day
          commits=$(git rev-list --first-parent --max-age=$(( $(git log -1 --format=%ct "$SHA") - 86400 )) "$SHA")
        fi
        : > ../upstream.txt
        for c in $commits; do
          subject=$(git log -1 --format=%s "$c")
          author=$(git log -1 --format=%an "$c")
          link="[\`${c:0:8}\`](https://github.com/$UPSTREAM/commit/$c)"
          if [[ "$subject" =~ ^Merge\ pull\ request\ \#([0-9]+)\ from\ ([^/]+)/ ]]; then
            pr=${BASH_REMATCH[1]}
            title=$(git log -1 --format=%b "$c" | grep -m1 -v '^[[:space:]]*$' || true)
            echo "- **[#$pr](https://github.com/$UPSTREAM/pull/$pr)** ${title:-$subject} (${BASH_REMATCH[2]})" >> ../upstream.txt
          else
            echo "- $link $subject ($author)" >> ../upstream.txt
          fi
        done
        {
          echo "since=$since"; echo "prev=$prev"
          echo "count=$(grep -c . ../upstream.txt || true)"
          echo "venom_count=$(grep -c . ../patches.txt || true)"
        } >> "$GITHUB_OUTPUT"
        cat ../upstream.txt

    - name: Changelog row
      if: steps.merge.outputs.conflict == 'false'
      env:
        SHA: ${{ steps.merge.outputs.upstream_sha }}
      run: |
        d="$DATE"
        psha="${{ steps.merge.outputs.patch_sha }}"
        release="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$OURS"
        row="| ${d:0:4}-${d:4:2}-${d:6:2} | [**nightly $d**]($release) | [\`${SHA:0:8}\`](https://github.com/$UPSTREAM/commit/$SHA) · [$TAG]($NIGHTLY_URL) | [\`${psha:0:8}\`](https://github.com/$PATCH_REPO/commit/$psha) | ${{ steps.upstream.outputs.count }} OptiScaler · ${{ steps.upstream.outputs.venom_count }} Venom |"
        cd venom
        grep -vF "/releases/tag/$OURS)" CHANGELOG-Opti-Venom.md | awk -v r="$row" '{print} /<!-- nightly-rows -->/{print r}' > cl.tmp
        mv cl.tmp CHANGELOG-Opti-Venom.md

    - name: Add MSBuild to PATH
      if: steps.merge.outputs.conflict == 'false'
      uses: microsoft/setup-msbuild@v3

    - name: Build Release x64
      if: steps.merge.outputs.conflict == 'false'
      working-directory: src
      shell: pwsh
      run: msbuild OptiScaler.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

    - name: Package
      id: package
      if: steps.merge.outputs.conflict == 'false'
      shell: pwsh
      run: |
        $name = "OptiScaler-Venom_nightly-$env:DATE"
        Copy-Item venom\CHANGELOG-Opti-Venom.md src\x64\Release\a\
        7z a -r "$name.7z" .\src\x64\Release\a\*.*
        if ($LASTEXITCODE -ne 0) { exit 1 }
        $hash = (Get-FileHash "$name.7z" -Algorithm SHA256).Hash.ToLower()
        [IO.File]::WriteAllText("$PWD\$name.7z.sha256", "$hash  $name.7z`n")
        "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    # Done before the release so the release tag sits on a commit made now (always made, even with no
    # changelog change): a tag on an older commit makes the nightly sink below newer releases
    - name: Record in changelog
      id: changelog
      if: steps.merge.outputs.conflict == 'false'
      working-directory: venom
      run: |
        git config user.name "LorenzoKy"
        git config user.email "136495843+LorenzoKy@users.noreply.github.com"
        git add CHANGELOG-Opti-Venom.md
        export TZ=UTC GIT_AUTHOR_DATE="$(date -u +%Y-%m-%dT%H:%M:%S+0000)"
        export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
        git commit -q --allow-empty -m "Changelog: $OURS"
        for i in 1 2 3; do
          if git pull -q --rebase origin main && git push -q origin HEAD:main; then
            echo "target=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sleep 10
        done
        echo "::warning::Could not push the changelog row, the release will be dated by the commit it is built from"

    - name: Publish pre-release
      if: steps.merge.outputs.conflict == 'false'
      env:
        SHA: ${{ steps.merge.outputs.upstream_sha }}
      run: |
        target="${{ steps.changelog.outputs.target }}"
        name="${{ steps.package.outputs.name }}"
        repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        d="$DATE"
        {
          echo "> [!WARNING]"
          echo "> **Automatic build, not tested in game.** For a checked version use the [latest stable release]($repo/releases/latest)."
          echo
          echo "| | Built from | Date |"
          echo "| --- | --- | --- |"
          if [ "${{ steps.merge.outputs.newer }}" = "true" ]; then
            echo "| **OptiScaler** | \`master\` at [\`${SHA:0:8}\`](https://github.com/$UPSTREAM/commit/$SHA), newer than nightly [$TAG]($NIGHTLY_URL) | ${{ steps.merge.outputs.upstream_date }} |"
          else
            echo "| **OptiScaler** | nightly [$TAG]($NIGHTLY_URL), \`master\` at [\`${SHA:0:8}\`](https://github.com/$UPSTREAM/commit/$SHA) | ${{ steps.merge.outputs.upstream_date }} |"
          fi
          echo "| **Venom** | [\`$PATCH_BRANCH\`](https://github.com/$PATCH_REPO/tree/$PATCH_BRANCH) at [\`${{ steps.merge.outputs.patch }}\`](https://github.com/$PATCH_REPO/commit/${{ steps.merge.outputs.patch_sha }}) | ${{ steps.merge.outputs.patch_date }} |"
          echo
          if [ "${{ steps.upstream.outputs.since }}" = "last" ]; then
            echo "### 🆕 OptiScaler changes since the last Venom nightly"
          else
            echo "### 🆕 OptiScaler changes of the last day"
          fi
          echo
          if [ -s upstream.txt ]; then cat upstream.txt; else echo "No upstream changes since the last Venom nightly."; fi
          echo
          echo "### 🐍 Venom changes in this build"
          echo
          cat patches.txt
          echo
          echo "### 📦 Install"
          echo
          echo "Extract \`$name.7z\` into the game's folder, as any OptiScaler build. To check the download: \`sha256sum -c $name.7z.sha256\`."
          echo
          echo "<sub>Every nightly is in the [changelog]($repo/blob/main/CHANGELOG-Opti-Venom.md#nightly-builds), dates are UTC. Problems with this build go [here]($repo/issues), not to the OptiScaler team.</sub>"
        } > notes.md
        gh release delete "$OURS" -R "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
        gh release create "$OURS" "$name.7z" "$name.7z.sha256" -R "$GITHUB_REPOSITORY" \
          --target "${target:-$GITHUB_SHA}" --prerelease --latest=false \
          --title "OptiScaler Venom nightly ${d:0:4}-${d:4:2}-${d:6:2}" --notes-file notes.md
        # A conflict that was solved closes its issue
        for n in $(gh issue list -R "$GITHUB_REPOSITORY" --label nightly-conflict --state open --json number --jq '.[].number'); do
          gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Solved: $OURS was built."
        done

    - name: Remove old nightlies
      if: steps.merge.outputs.conflict == 'false'
      run: |
        gh release list -R "$GITHUB_REPOSITORY" -L 200 --json tagName --jq '.[].tagName' \
          | grep '^opti-venom-nightly-' | sort -r | tail -n +$((KEEP_NIGHTLIES + 1)) \
          | while read -r t; do gh release delete "$t" -R "$GITHUB_REPOSITORY" --cleanup-tag -y; done
