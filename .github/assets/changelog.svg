<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="200" viewBox="0 0 1280 200" role="img" aria-label="OptiScaler Venom changelog">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08070c"/>
      <stop offset="1" stop-color="#140b20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="200" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="200" rx="20" fill="url(#grid)"/>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="72" y="82" fill="#9ca3af" font-size="22" font-weight="600" letter-spacing="5">OPTISCALER VENOM</text>
    <text x="70" y="146" fill="url(#accent)" font-size="64" font-weight="800">Changelog</text>
  </g>
  <!-- frame time trace -->
  <path d="M720 120 L760 112 L800 116 L840 98 L880 108 L920 104 L960 82 L1000 102 L1040 110 L1080 100 L1120 106 L1160 92 L1208 104" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.9"/>
  <g>
    <circle cx="960" cy="82" r="6" fill="#8b5cf6"/>
    <circle cx="1208" cy="104" r="6" fill="#a78bfa"/>
  </g>
</svg>
